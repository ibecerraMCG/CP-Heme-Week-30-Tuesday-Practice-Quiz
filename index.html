<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 30 Tuesday Practice Questions</title>
    <style>
        /* --- CSS Variables & Themes --- */
        :root {
            /* Base Transition */
            --transition-speed: 0.3s;
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        /* 1. Modern Dark (Default) */
        [data-theme="dark"] {
            --bg-body: #1e293b;
            --bg-card: #334155;
            --bg-header: #0f172a;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --text-accent: #38bdf8;
            --border-color: #475569;
            --highlight-bg: #475569;
            --button-bg: #38bdf8;
            --button-text: #0f172a;
            --button-hover: #0ea5e9;
            --feedback-success-bg: #064e3b;
            --feedback-success-border: #059669;
            --feedback-success-text: #a7f3d0;
            --feedback-error-bg: #7f1d1d;
            --feedback-error-border: #dc2626;
            --feedback-error-text: #fecaca;
        }

        /* 2. Modern Light */
        [data-theme="light"] {
            --bg-body: #f3f4f6;
            --bg-card: #ffffff;
            --bg-header: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --text-accent: #2563eb;
            --border-color: #e5e7eb;
            --highlight-bg: #f3f4f6;
            --button-bg: #2563eb;
            --button-text: #ffffff;
            --button-hover: #1d4ed8;
            --feedback-success-bg: #ecfdf5;
            --feedback-success-border: #34d399;
            --feedback-success-text: #065f46;
            --feedback-error-bg: #fef2f2;
            --feedback-error-border: #f87171;
            --feedback-error-text: #991b1b;
        }

        /* 3. Midnight (Pure Black) */
        [data-theme="midnight"] {
            --bg-body: #000000;
            --bg-card: #000000;
            --bg-header: #000000;
            --text-main: #e0e0e0;
            --text-muted: #888888;
            --text-accent: #90caf9;
            --border-color: #333333;
            --highlight-bg: #1a1a1a;
            --button-bg: #90caf9;
            --button-text: #000000;
            --button-hover: #42a5f5;
            --feedback-success-bg: #051b11;
            --feedback-success-border: #0f5132;
            --feedback-success-text: #75b798;
            --feedback-error-bg: #2c0b0e;
            --feedback-error-border: #842029;
            --feedback-error-text: #ea868f;
        }

        /* 4. Legacy Dark (Original) */
        [data-theme="legacy-dark"] {
            --bg-body: #2d343e;
            --bg-card: #3c424f;
            --bg-header: #3c424f;
            --text-main: #e8e6e3;
            --text-muted: #b0c4de;
            --text-accent: #8ab4f8;
            --border-color: #555;
            --highlight-bg: #454c5a;
            --button-bg: #8ab4f8;
            --button-text: #202124;
            --button-hover: #a3c5f9;
            --feedback-success-bg: #344e41;
            --feedback-success-border: #52b788;
            --feedback-success-text: #c7f9cc;
            --feedback-error-bg: #5e2129;
            --feedback-error-border: #a4133c;
            --feedback-error-text: #f8d7da;
        }

        /* 5. Sepia (Reading Mode) */
        [data-theme="sepia"] {
            --bg-body: #f4ecd8;
            --bg-card: #fdf6e3;
            --bg-header: #e4d5b7;
            --text-main: #433422;
            --text-muted: #7c6f5a;
            --text-accent: #a05a2c;
            --border-color: #d3c4a5;
            --highlight-bg: #ebe1c9;
            --button-bg: #a05a2c;
            --button-text: #fdf6e3;
            --button-hover: #864822;
            --feedback-success-bg: #e6f4ea;
            --feedback-success-border: #8ab893;
            --feedback-success-text: #2e4c35;
            --feedback-error-bg: #f9e3e3;
            --feedback-error-border: #d48f8f;
            --feedback-error-text: #5c2b2b;
        }

        /* 6. High Contrast */
        [data-theme="contrast"] {
            --bg-body: #000000;
            --bg-card: #000000;
            --bg-header: #000000;
            --text-main: #ffffff;
            --text-muted: #dddddd;
            --text-accent: #ffff00;
            --border-color: #ffffff;
            --highlight-bg: #333333;
            --button-bg: #ffff00;
            --button-text: #000000;
            --button-hover: #e6e600;
            --feedback-success-bg: #000000;
            --feedback-success-border: #00ff00;
            --feedback-success-text: #00ff00;
            --feedback-error-bg: #000000;
            --feedback-error-border: #ff0000;
            --feedback-error-text: #ff0000;
        }

        /* --- Global Reset & Layout --- */
        * { box-sizing: border-box; }
        
        body {
            font-family: var(--font-main);
            margin: 0;
            background-color: var(--bg-body);
            color: var(--text-main);
            transition: background-color var(--transition-speed), color var(--transition-speed);
            line-height: 1.6;
        }

        /* --- Header --- */
        header {
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            /* Default to Sticky */
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        /* Class to remove sticky behavior */
        header.unpinned {
            position: relative;
            box-shadow: none;
        }

        header h1 {
            font-size: 1.25rem;
            margin: 0;
            color: var(--text-accent);
        }

        .controls-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .pin-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 1rem;
            transition: background-color 0.2s;
        }

        .pin-btn:hover {
            background-color: var(--highlight-bg);
        }

        .pin-btn.pin-active {
            color: var(--text-accent);
            border-color: var(--text-accent);
            background-color: rgba(0, 0, 0, 0.1);
        }

        .theme-control {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        select#theme-select {
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-card);
            color: var(--text-main);
            cursor: pointer;
            font-family: inherit;
        }

        /* --- Main Content --- */
        .container {
            max-width: 850px;
            margin: 2rem auto;
            padding: 0 1rem 4rem 1rem;
        }

        .section-header {
            margin-top: 3rem;
            margin-bottom: 1.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--text-accent);
            color: var(--text-accent);
            font-size: 1.5rem;
            font-weight: 700;
        }

        /* --- Question Card --- */
        .question-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease;
        }

        .lo-box {
            background-color: var(--highlight-bg);
            border-left: 4px solid var(--text-accent);
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 4px;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-style: italic;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        /* --- Options --- */
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .option-label {
            display: flex;
            align-items: flex-start;
            padding: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-label:hover {
            background-color: var(--highlight-bg);
            border-color: var(--text-muted);
        }

        .option-label input {
            margin-top: 0.3rem;
            margin-right: 1rem;
            accent-color: var(--text-accent);
            transform: scale(1.2);
        }

        /* --- Buttons --- */
        .btn-check {
            margin-top: 1.5rem;
            background-color: var(--button-bg);
            color: var(--button-text);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            font-size: 1rem;
        }

        .btn-check:hover {
            opacity: 0.9;
        }

        /* --- Feedback Area --- */
        .feedback {
            margin-top: 1.5rem;
            padding: 1.5rem;
            border-radius: 8px;
            display: none; /* Hidden by default */
            border: 1px solid transparent;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback.correct {
            background-color: var(--feedback-success-bg);
            border-color: var(--feedback-success-border);
            color: var(--feedback-success-text);
        }

        .feedback.incorrect {
            background-color: var(--feedback-error-bg);
            border-color: var(--feedback-error-border);
            color: var(--feedback-error-text);
        }

        .feedback-header {
            font-weight: 800;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            display: block;
        }

        .rationale {
            margin-top: 1rem;
            font-size: 0.95rem;
        }

        .source {
            display: block;
            margin-top: 1rem;
            font-size: 0.85rem;
            opacity: 0.8;
            font-style: italic;
            border-top: 1px dashed currentColor;
            padding-top: 0.5rem;
        }

        /* --- Mobile Tweaks --- */
        @media (max-width: 600px) {
            header { padding: 1rem; flex-direction: column; gap: 10px; align-items: flex-start; }
            .controls-wrapper { width: 100%; justify-content: space-between; }
            .question-card { padding: 1.5rem; }
            header h1 { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <header id="main-header">
        <h1>Week 30 Tuesday Practice Questions</h1>
        <div class="controls-wrapper">
            <!-- Pin Button -->
            <button class="pin-btn pin-active" id="pin-btn" onclick="toggleHeader()" title="Pin/Unpin Header">
                📍
            </button>
            
            <div class="theme-control">
                <label for="theme-select">Theme:</label>
                <select id="theme-select" onchange="changeTheme(this.value)">
                    <option value="dark">Modern Dark</option>
                    <option value="midnight">Midnight</option>
                    <option value="light">Modern Light</option>
                    <option value="legacy-dark">Legacy Dark</option>
                    <option value="sepia">Sepia</option>
                    <option value="contrast">High Contrast</option>
                </select>
            </div>
        </div>
    </header>

    <div class="container" id="quiz-root">
        <!-- Content injected via JS -->
    </div>

    <script>
        // --- Data ---
        const quizData = [
            // --- Section 1: Mechanics and Ventilation ---
            {
                section: "Mechanics and Ventilation",
                maskedLO: "LO1: Describe the functional importance of the pleural space and how [specific pressure] contributes to gas pressure gradients that determine air flow",
                fullLO: "LO1: Describe the functional importance of the pleural space and how transpulmonary pressure contributes to gas pressure gradients that determine air flow",
                question: "A 25-year-old male is stabbed in the chest, resulting in a pneumothorax. In a healthy individual prior to this injury, the chest wall has a natural tendency to spring outward, while the lung has a natural tendency to collapse inward. These opposing forces create a negative pressure within the intrapleural space. At the end of a normal expiration (Functional Residual Capacity), what is the relationship between these forces?",
                options: {
                    A: "The force of the chest wall is greater than the force of the lung",
                    B: "The force of the lung is greater than the force of the chest wall",
                    C: "The forces exerted by the chest wall and the lungs are equal in intensity and opposite in direction",
                    D: "The intrapleural pressure becomes positive to balance the forces",
                    E: "The transpulmonary pressure becomes zero"
                },
                correctAnswer: "C",
                rationale: "At FRC (equilibrium), the elastic recoil of the lung (pulling in) is balanced by the chest wall's tendency to spring out.",
                source: "Respiration_PDF.pdf, Page 29: \"At functional residual capacity (FRC), the forces exerted by the chest wall and the lungs are equal in intensity and opposite in direction.\""
            },
            {
                section: "Mechanics and Ventilation",
                maskedLO: "LO1: Describe the functional importance of the pleural space and how [specific pressure] contributes to gas pressure gradients that determine air flow",
                fullLO: "LO1: Describe the functional importance of the pleural space and how transpulmonary pressure contributes to gas pressure gradients that determine air flow",
                question: "During a normal breathing cycle, air flows into the lungs when the alveolar pressure drops below atmospheric pressure. Which physiological event initiates the pressure change required for inspiration?",
                options: {
                    A: "Contraction of the abdominal muscles",
                    B: "Contraction of the diaphragm and respiratory muscles",
                    C: "Elevation of alveolar surface tension",
                    D: "Relaxation of the external intercostal muscles",
                    E: "Relaxation of the diaphragm"
                },
                correctAnswer: "B",
                rationale: "Inspiration is initiated by the contraction of the diaphragm and respiratory muscles, which increases thoracic volume and decreases pressure in the lungs (Palv), creating a gradient for air to move in.",
                source: "Respiration_PDF.pdf, Page 7: \"During inspiration: Diaphragm and respiratory muscles contract... Pressure in the lungs decreases... resulting pressure gradient... causes air to move into the lungs\""
            },
            {
                section: "Mechanics and Ventilation",
                maskedLO: "LO2: Understand why resistance to air flow changes throughout the respiratory system and identify [structural aspects] that contribute to this resistance",
                fullLO: "LO2: Understand why resistance to air flow changes throughout the respiratory system and identify structural aspects that contribute to this resistance",
                question: "A physiologist is measuring airway resistance at various levels of the tracheobronchial tree. Contrary to what might be expected based on the small diameter of individual terminal bronchioles, the total resistance in the small airways is very low. According to the provided text, the principal site of resistance to airflow in the lungs is located in the:",
                options: {
                    A: "Alveolar ducts",
                    B: "Larynx",
                    C: "Medium-sized bronchi",
                    D: "Terminal bronchioles",
                    E: "Trachea"
                },
                correctAnswer: "C",
                rationale: "While individual small airways are narrow, the massive number of parallel branches increases the total cross-sectional area, lowering resistance. The main site of resistance is the medium-sized bronchi.",
                source: "Respiration_PDF.pdf, Page 31: \"The principal site of resistance to airflow in the lungs is in the medium-sized bronchi\""
            },
            {
                section: "Mechanics and Ventilation",
                maskedLO: "LO2: Understand why resistance to air flow changes throughout the respiratory system and identify [structural aspects] that contribute to this resistance",
                fullLO: "LO2: Understand why resistance to air flow changes throughout the respiratory system and identify structural aspects that contribute to this resistance",
                question: "A 60-year-old patient with severe Chronic Obstructive Pulmonary Disease (COPD) breathes at a higher lung volume than normal. This adaptive mechanism helps minimize the work of breathing because airway resistance changes as a function of lung volume. Which of the following describes the relationship between lung volume and airway resistance?",
                options: {
                    A: "Airway resistance decreases as lung volume increases",
                    B: "Airway resistance increases as lung volume increases",
                    C: "Airway resistance is independent of lung volume",
                    D: "Conductance decreases as lung volume increases",
                    E: "Resistance is highest at Total Lung Capacity (TLC)"
                },
                correctAnswer: "A",
                rationale: "As lung volume increases, the airways are pulled open (tethering), which increases conductance and decreases resistance. Patients with COPD breathe at high volumes to utilize this lower resistance.",
                source: "Respiration_PDF.pdf, Page 32: \"Airway resistance (AWR) decreases as lung volume increases... These processes explain why patients with severe lung disease (COPD) breathe at high lung volumes\""
            },
            {
                section: "Mechanics and Ventilation",
                maskedLO: "LO3: Define surface tension and describe how it applies to lung mechanics, including the effects of [specific factors].",
                fullLO: "LO3: Define surface tension and describe how it applies to lung mechanics, including the effects of alveolar size and the role of surfactants",
                question: "A medical student creates a model of two alveoli of different sizes connected by a common airway. In the absence of surfactant, and assuming constant surface tension, the Law of Laplace predicts which of the following outcomes?",
                options: {
                    A: "Air will flow from the large alveolus to the small alveolus",
                    B: "Air will flow from the small alveolus to the large alveolus",
                    C: "Both alveoli will maintain their size",
                    D: "The large alveolus will collapse",
                    E: "The pressure in the large alveolus will be higher than in the small alveolus"
                },
                correctAnswer: "B",
                rationale: "According to the Law of Laplace (P=2T/r), if tension (T) is constant, the smaller radius (r) generates higher pressure. Air flows from high to low pressure, emptying the small alveolus into the large one.",
                source: "Respiration_PDF.pdf, Page 16: \"according to Laplace’s law, the pressure in the smaller alveolus must be greater than in the larger alveolus, and the smaller alveolus will empty into the larger alveolus.\""
            },
            {
                section: "Mechanics and Ventilation",
                maskedLO: "LO3: Define surface tension and describe how it applies to lung mechanics, including the effects of [specific factors].",
                fullLO: "LO3: Define surface tension and describe how it applies to lung mechanics, including the effects of alveolar size and the role of surfactants",

                options: {
                    A: "It increases surface tension as alveolar radius decreases",
                    B: "It keeps surface tension constant regardless of alveolar size",
                    C: "It lowers surface tension more as the alveolar radius decreases",
                    D: "It prevents the stretching of Type II cells",
                    E: "It raises surface tension to prevent alveolar over-expansion"
                },
                correctAnswer: "C",
                rationale: "Surfactant reduces surface tension generally, but crucially, it reduces it more as the alveolus gets smaller, which prevents collapse (atelectasis) according to the Law of Laplace.",
                source: "Respiration_PDF.pdf, Page 21: \"Surfactant lowers the surface tension more as the alveolar radius decreases\""
            },
            {
                section: "Mechanics and Ventilation",
                maskedLO: "LO4: Draw the compliance curves for the lungs, chest wall, and respiratory system... Show and explain the significance of the [resting positions].",

                options: {
                    A: "It is equal to the compliance of the chest wall alone",
                    B: "It is equal to the compliance of the lung alone",
                    C: "It is greater than the individual compliance of either component",
                    D: "It is lower than the individual compliance of either component",
                    E: "It is the sum of the lung and chest wall compliances"
                },
                correctAnswer: "D",
                rationale: "Because the components are in series, compliances add as reciprocals (1/C_total=1/C_chest+1/C_lung). This results in a total compliance that is lower than either individual component.",
                source: "Respiration_PDF.pdf, Page 14: \"The chest-lung unit has lower compliance than the individual components.\""
            },
            {
                section: "Mechanics and Ventilation",
                maskedLO: "LO4: Draw the compliance curves for the lungs, chest wall, and respiratory system... Show and explain the significance of the [resting positions].",
                fullLO: "LO4: Draw the compliance curves for the lungs, chest wall, and respiratory system on the same set of axes. Show and explain the significance of the resting positions for each of these three structures",
                question: "A respiratory physiologist analyzes the relaxation pressure-volume curve of the respiratory system. At volumes below the Functional Residual Capacity (FRC), the balance of forces acting on the respiratory system creates a tendency for the system to:",
                options: {
                    A: "Collapse further",
                    B: "Maintain the current volume",
                    C: "Move toward a higher volume (back to FRC)",
                    D: "Generate a positive airway pressure",
                    E: "Decrease chest wall compliance"
                },
                correctAnswer: "C",
                rationale: "FRC is the equilibrium point. Below FRC, the outward recoil of the chest wall dominates, pushing the system back toward the higher equilibrium volume.",
                source: "Respiration_PDF.pdf, Page 29: \"At volumes below FRC, the balance of forces pushes the system toward a higher volume, that is, back to FRC.\""
            },
            {
                section: "Mechanics and Ventilation",
                maskedLO: "LO5: Draw a normal spirogram... Identify the volumes and capacities that [cannot be measured directly].",
                fullLO: "LO5: Draw a normal spirogram, label the four lung volumes and four capacities. Identify the volumes that comprise each of the capacities. Identify the volumes and capacities that cannot be measured by spirometry",

                options: {
                    A: "Forced Vital Capacity (FVC)",
                    B: "Functional Residual Capacity (FRC)",
                    C: "Inspiratory Capacity (IC)",
                    D: "Vital Capacity (VC)",
                    E: "Tidal Volume (VT)"
                },
                correctAnswer: "B",
                rationale: "FRC includes the Residual Volume (RV). Since RV cannot be exhaled, it cannot be measured by spirometry. Therefore, FRC cannot be measured by spirometry.",
                source: "Respiration_PDF.pdf, Page 47: \"The RV, the FRC, and the TLC cannot be determined with a spirometer because the subject cannot exhale all the gas in the lungs.\""
            },
            {
                section: "Mechanics and Ventilation",
                maskedLO: "LO5: Draw a normal spirogram... Identify the volumes and capacities that [cannot be measured directly].",
                fullLO: "LO5: Draw a normal spirogram, label the four lung volumes and four capacities. Identify the volumes that comprise each of the capacities. Identify the volumes and capacities that cannot be measured by spirometry",

                options: {

                    D: "Total Lung Capacity",
                    E: "Vital Capacity"

                source: "Respiration_PDF.pdf, Page 47: \"The TV, IRV, ERV, IC, and VC can all be measured with a spirometer\""

            {
                section: "Mechanics and Ventilation",

                    C: "6000 mL/min",

                },
                correctAnswer: "B",
                rationale: "Alveolar ventilation = (Tidal Volume - Dead Space) × Frequency. (500-150)×15=350×15=5250 mL/min.",
                source: "Respiration_PDF.pdf, Page 42: \"Tidal volume 500 ml... Anatomic dead space 150 ml... Frequency 15/min... Alveolar ventilation 5250 ml/min\""
            },
            {
                section: "Mechanics and Ventilation",
                maskedLO: "LO6: Calculate alveolar ventilation from measures of tidal volume and dead space. Explain the difference between [types of dead space].",
                fullLO: "LO6: Calculate alveolar ventilation from measures of tidal volume and dead space. Explain the difference between anatomical and physiological dead space",

                options: {

        // --- Core Logic ---
        const quizRoot = document.getElementById('quiz-root');
        const themeSelect = document.getElementById('theme-select');
        const pinBtn = document.getElementById('pin-btn');
        const mainHeader = document.getElementById('main-header');

        function initQuiz() {
            // Render Questions
            let currentSection = "";
            let questionCount = 0;
            
            quizData.forEach((item, index) => {
                // Insert Section Header if needed
                if (item.section !== currentSection) {
                    currentSection = item.section;
                    const sectionHeader = document.createElement('h2');
                    sectionHeader.className = 'section-header';
                    sectionHeader.textContent = currentSection;
                    quizRoot.appendChild(sectionHeader);
                }

                questionCount++;

                // Create Card
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-card-${index}`;

                // Learning Objective (Masked)
                const loBox = document.createElement('div');
                loBox.className = 'lo-box';
                loBox.id = `lo-${index}`;
                loBox.textContent = item.maskedLO;
                card.appendChild(loBox);

                // Question Text
                const qText = document.createElement('div');
                qText.className = 'question-text';
                qText.textContent = `${questionCount}. ${item.question}`;
                card.appendChild(qText);

                // Options Container
                const optionsGrid = document.createElement('div');
                optionsGrid.className = 'options-grid';

                for (const [key, value] of Object.entries(item.options)) {
                    const label = document.createElement('label');
                    label.className = 'option-label';
                    
                    const input = document.createElement('input');
                    input.type = 'radio';
                    input.name = `question-${index}`;
                    input.value = key;

                    const span = document.createElement('span');
                    span.textContent = `${key}. ${value}`;

                    label.appendChild(input);
                    label.appendChild(span);
                    optionsGrid.appendChild(label);
                }
                card.appendChild(optionsGrid);

                // Check Button
                const btn = document.createElement('button');
                btn.className = 'btn-check';
                btn.textContent = 'Check Answer';
                btn.onclick = () => checkAnswer(index);
                card.appendChild(btn);

                // Feedback Container
                const feedback = document.createElement('div');
                feedback.className = 'feedback';
                feedback.id = `feedback-${index}`;
                card.appendChild(feedback);

                quizRoot.appendChild(card);
            });

            // Load saved theme
            const savedTheme = localStorage.getItem('quizTheme') || 'dark';
            changeTheme(savedTheme);
            themeSelect.value = savedTheme;

            // Load saved pin state
            const savedPinState = localStorage.getItem('headerPinned');
            // Default to true (pinned) if not set or if set to true
            if (savedPinState === 'false') {
                toggleHeader(false); 
            } else {
                toggleHeader(true);
            }
        }

        function checkAnswer(index) {
            const selected = document.querySelector(`input[name="question-${index}"]:checked`);
            const feedbackEl = document.getElementById(`feedback-${index}`);
            const loEl = document.getElementById(`lo-${index}`);
            const data = quizData[index];

            if (!selected) {
                alert("Please select an answer.");
                return;
            }

            // Reveal LO
            loEl.textContent = data.fullLO;

            // Generate Feedback HTML
            const isCorrect = selected.value === data.correctAnswer;
            
            let html = `<span class="feedback-header">${isCorrect ? "Correct!" : "Incorrect"}</span>`;
            if (!isCorrect) {
                html += `<div>The correct answer is <strong>${data.correctAnswer}</strong>.</div>`;
            }
            
            html += `<div class="rationale"><strong>Rationale:</strong> ${data.rationale}</div>`;
            html += `<div class="source"><strong>Source:</strong> ${data.source}</div>`;

            feedbackEl.innerHTML = html;
            feedbackEl.className = `feedback ${isCorrect ? 'correct' : 'incorrect'}`;
            feedbackEl.style.display = 'block';
        }

        function changeTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
            localStorage.setItem('quizTheme', themeName);
        }

        function toggleHeader(forceState) {
            // Determine current state based on class presence
            const isCurrentlyPinned = !mainHeader.classList.contains('unpinned');
            
            // If forceState is provided (boolean), use it. Otherwise toggle current state.
            const newState = (typeof forceState === 'boolean') ? forceState : !isCurrentlyPinned;

            if (newState) {
                // Pin
                mainHeader.classList.remove('unpinned');
                pinBtn.classList.add('pin-active');
                localStorage.setItem('headerPinned', 'true');
            } else {
                // Unpin
                mainHeader.classList.add('unpinned');
                pinBtn.classList.remove('pin-active');
                localStorage.setItem('headerPinned', 'false');
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', initQuiz);

    </script>
